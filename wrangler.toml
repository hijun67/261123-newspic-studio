# ============================================================
# 뉴스픽 스튜디오 | Cloudflare Pages
#  - 정적 자산: dist/ (node scripts/build.mjs)
#  - Functions: functions/ 자동 인식
#  - KV: newspic-studio-kv (아카이브). 바인딩이 없어도 브라우저 저장으로 폴백한다.
#  - 배포: npx wrangler pages deploy dist --project-name newspic-studio --branch main
# ============================================================
name = "newspic-studio"
compatibility_date = "2026-11-20"
pages_build_output_dir = "dist"

# Workers AI — 무료 할당량 내에서 4컷 배경 이미지를 생성한다 (Pollinations 실패 시에도 든든한 경로)
[ai]
binding = "AI"

[[kv_namespaces]]
binding = "ARCHIVE"
id = "86ffcbaf522844558e798e723ec2b33f"

# 뉴스픽 파트너스 추적 파라미터 (한일 님 계정 기본값). 시크릿 아님 — 필요하면 대시보드에서 덮어쓸 수 있다.
[vars]
PARTNERS_LCP = "v9sIx86b"
PARTNERS_CP = "H0cKa48w"
PARTNERS_UTM = "np260905v9sIx86b"
